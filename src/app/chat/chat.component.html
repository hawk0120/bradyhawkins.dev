<div class="chat-container">
				<div class="chat-box">
								<div class="chat-message">
												<strong>{{ responseMessage}}:</strong> 
								</div>
				</div>

				<div class="chat-input">
								<textarea type="text" [(ngModel)]="messageText" placeholder="Type a message to chat with me..." (keyup.enter)="sendMessage()" >
												{{ messageText }}
								</textarea>
												<button (click)="sendMessage()">Send</button>
				</div>
</div>
